name: Build & Release

# 出包：Windows 安装包 / 便携版 + Android APK（+ Linux 与 Web 产物）
# - 推送 v* 标签时自动出包并创建 Release
# - 也可以在 Actions 页面手动触发（workflow_dispatch）

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (例如 v0.1.0-demo)"
        required: true
        default: "v0.1.0-demo"

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
  JAVA_VERSION: "21"

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (jpackage / WiX)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check WiX availability
        shell: bash
        run: |
          where candle.exe || true
          where light.exe || true
          ls "C:/Program Files (x86)/WiX Toolset" 2>/dev/null || echo "wix not found in default location"

      # MSI 需要 WiX；若 runner 未提供，下面的便携版仍然可用（不阻断整个出包流程）
      - name: Build MSI (WiX)
        shell: bash
        continue-on-error: true
        run: ./gradlew --no-daemon :composeApp:packageMsi --console=plain

      - name: Build portable app image
        shell: bash
        run: ./gradlew --no-daemon :composeApp:createDistributable --console=plain

      # 单文件「双击即运行」：7zSD.sfx（LZMA SDK 自带的 installer SFX）+ 7z 载荷
      # 该 SFX 的行为（源自 C/Util/SfxSetup/SfxSetup.c）：
      #   1) 解压到临时目录；2) 自动执行根目录下名为 run/setup/install/start 的 exe|cmd|bat；
      #   3) WaitForSingleObject 等主程序退出；4) 删除临时目录。
      # 所以直接把 jpackage app-image 的内容作为载荷根，再放一个 run.cmd 调起 LumiCode.exe
      #（不改名 launcher：jpackage 启动器按自身文件名找 app/<name>.cfg）。
      - name: Build single-file portable EXE (7-Zip SFX)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $appImage = "composeApp/build/compose/binaries/main/app/LumiCode"
          if (-not (Test-Path (Join-Path $appImage "LumiCode.exe"))) { throw "app image not found: $appImage" }

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "C:\Program Files (x86)\7-Zip\7z.exe" }
          if (-not (Test-Path $sevenZip)) { throw "7z.exe not found" }

          # 7zSD.sfx 只随 LZMA SDK 分发（7-Zip 安装目录里的 7z.sfx 不支持自动执行）
          # 注意：7-Zip 的 -o 开关必须与目录名连写，PowerShell 下整体加引号
          $sfx = $null
          foreach ($url in @("https://www.7-zip.org/a/lzma1900.7z", "https://www.7-zip.org/a/lzma1604.7z")) {
            try {
              Invoke-WebRequest -Uri $url -OutFile sdk.7z -UseBasicParsing
              Remove-Item -Recurse -Force sdkx -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path sdkx | Out-Null
              & $sevenZip e sdk.7z "-o$PWD/sdkx" "bin/7zSD.sfx" -y -bso0 -bsp0
              $found = Get-ChildItem -Path sdkx -Filter "7zSD.sfx" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                $sfx = $found.FullName
                Write-Host "sfx module: $sfx ($($found.Length) bytes, from $url)"
                break
              }
            } catch { Write-Host "skip $url : $_" }
          }
          if (-not $sfx) { throw "could not obtain 7zSD.sfx" }
          Copy-Item -Force $sfx "$env:GITHUB_WORKSPACE/7zSD.sfx"

          # 入口名：实测这个 2019 版 7zSD.sfx 只认 setup.exe（run/install/start 与 .cmd 都不会被执行）
          # setup.exe 就是 jpackage launcher 的副本；launcher 按自身文件名找 app/<name>.cfg，
          # 所以同时复制一份 setup.cfg，保证用哪个名字都能读到配置
          Copy-Item -Force (Join-Path $appImage "LumiCode.exe") (Join-Path $appImage "setup.exe")
          Copy-Item -Force (Join-Path $appImage "app/LumiCode.cfg") (Join-Path $appImage "app/setup.cfg")
          if (-not (Test-Path (Join-Path $appImage "setup.exe"))) { throw "failed to stage setup.exe" }
          if (-not (Test-Path (Join-Path $appImage "app/setup.cfg"))) { throw "failed to stage app/setup.cfg" }
          Write-Host "app image files: $((Get-ChildItem $appImage -Recurse -File).Count)"

          $payload = Join-Path $env:GITHUB_WORKSPACE "payload.7z"
          Remove-Item -Force $payload -ErrorAction SilentlyContinue
          Push-Location $appImage
          & $sevenZip a -t7z -mx=7 -r -bso0 -bsp0 $payload "*"
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "7z payload failed with exit code $code" }
          if (-not (Test-Path $payload)) { throw "payload.7z was not created" }
          $payloadSize = (Get-Item $payload).Length
          Write-Host "payload.7z: $payloadSize bytes"
          if ($payloadSize -lt 20MB) { throw "payload looks too small ($payloadSize bytes) - packaging is broken" }

          New-Item -ItemType Directory -Force -Path out | Out-Null
          $target = Join-Path $env:GITHUB_WORKSPACE "out/LumiCode-portable.exe"
          # 纯 .NET 拼接，避免 cmd /c copy 静默失败
          $out = [System.IO.File]::Create($target)
          try {
            $sfxBytes = [System.IO.File]::ReadAllBytes($sfx)
            $out.Write($sfxBytes, 0, $sfxBytes.Length)
            $in = [System.IO.File]::OpenRead($payload)
            try { $in.CopyTo($out) } finally { $in.Dispose() }
          } finally { $out.Dispose() }

          $exeSize = (Get-Item $target).Length
          Write-Host "LumiCode-portable.exe: $exeSize bytes"
          if ($exeSize -lt 20MB) { throw "portable exe looks too small ($exeSize bytes)" }
          Write-Host "--- payload listing (first 16 lines) ---"
          & $sevenZip l $target | Select-Object -First 16 | Out-String | Write-Host
          Write-Host "--- entries named LumiCode.exe / run.cmd / java.exe ---"
          & $sevenZip l $target | Select-String -Pattern "LumiCode.exe|run.cmd|java.exe" | Out-String | Write-Host

      # 机制自检：7zSD.sfx 到底认哪个入口名？
      # lzma1900 里的 bin/7zSD.sfx 是 2019 年的预编译二进制，比 SDK 里的 SfxSetup.c 还老，
      # 行为未必一致，所以逐个候选名建迷你 SFX 实测（用 cmd.exe 当探针，靠命令行参数写标记文件）
      - name: Probe SFX entry names (mini payloads)
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "C:\Program Files (x86)\7-Zip\7z.exe" }
          $sfx = "$env:GITHUB_WORKSPACE/7zSD.sfx"
          if (-not (Test-Path $sfx)) { throw "7zSD.sfx not kept by the packaging step" }

          $cmdExe = Join-Path $env:SystemRoot "System32\cmd.exe"
          $results = @{}
          foreach ($name in @("setup.exe", "run.exe", "run.cmd")) {
            $tag = ($name -replace '\.', '')
            $dir = Join-Path $env:RUNNER_TEMP "sfxprobe-$tag"
            $marker = Join-Path $env:RUNNER_TEMP "sfx-$tag.txt"
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
            Remove-Item -Force $marker -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $dir | Out-Null

            if ($name.EndsWith(".exe")) {
              Copy-Item -Force $cmdExe (Join-Path $dir $name)
            } else {
              $body = "@echo off`r`necho ran > `"$marker`"`r`n"
              [System.IO.File]::WriteAllText((Join-Path $dir $name), $body, [System.Text.Encoding]::ASCII)
            }

            Push-Location $dir
            & $sevenZip a -t7z -bso0 -bsp0 (Join-Path $dir "p.7z") "*"
            Pop-Location

            $probeExe = Join-Path $dir "probe.exe"
            $out = [System.IO.File]::Create($probeExe)
            try {
              $b = [System.IO.File]::ReadAllBytes($sfx); $out.Write($b, 0, $b.Length)
              $in = [System.IO.File]::OpenRead((Join-Path $dir "p.7z"))
              try { $in.CopyTo($out) } finally { $in.Dispose() }
            } finally { $out.Dispose() }

            # 把写标记的动作作为 SFX 的参数传给被执行的程序（cmd.exe 会执行 /c）
            $proc = Start-Process -FilePath $probeExe -ArgumentList @("/c", "echo ran> `"$marker`"") -PassThru
            $hit = $false
            for ($i = 0; $i -lt 12 -and -not $hit; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path $marker) { $hit = $true }
            }
            $results[$name] = $hit
            Write-Host ("entry {0,-12} -> {1}" -f $name, $(if ($hit) { "EXECUTED" } else { "not executed" }))
            if (-not $proc.HasExited) { $proc | Stop-Process -Force -ErrorAction SilentlyContinue }
          }

          $winners = $results.GetEnumerator() | Where-Object { $_.Value } | Select-Object -ExpandProperty Key
          if (-not $winners) { throw "none of the candidate entry names were executed by 7zSD.sfx" }
          Write-Host "working entry names: $($winners -join ', ')"

      # 真机冒烟测试：在 Windows runner 上直接跑这个 exe，轮询确认它解压出 app image
      # 探针用 [System.IO.Path]::GetTempPath()，与 SFX 内部 GetTempPathW 完全一致
      # （runner 上 $env:TEMP 可能为空，只信它就会探测不到）
      - name: Smoke test portable EXE
        shell: pwsh
        run: |
          $exe = "out/LumiCode-portable.exe"
          if (-not (Test-Path $exe)) { throw "portable exe missing - the 7zSFX step failed, see its log" }

          $roots = @()
          foreach ($t in @([System.IO.Path]::GetTempPath(), $env:TEMP, $env:TMP, $env:RUNNER_TEMP)) {
            if ($t -and (Test-Path $t)) { $roots += (Resolve-Path $t).Path.TrimEnd('\') }
          }
          $roots = $roots | Select-Object -Unique
          Write-Host "temp roots: $($roots -join ' | ')"
          $before = @{}
          foreach ($r in $roots) { $before[$r] = @(Get-ChildItem $r -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) }

          $p = Start-Process -FilePath $exe -PassThru
          Write-Host "started $exe pid=$($p.Id)"

          $extracted = $false
          for ($i = 0; $i -lt 45 -and -not $extracted; $i++) {
            Start-Sleep -Seconds 2
            foreach ($r in $roots) {
              $dirs = Get-ChildItem $r -Directory -ErrorAction SilentlyContinue |
                      Where-Object { $before[$r] -notcontains $_.Name }
              foreach ($d in $dirs) {
                $files = @(Get-ChildItem $d.FullName -Recurse -File -ErrorAction SilentlyContinue)
                if ($files.Count -gt 0) {
                  Write-Host "candidate $($d.FullName): $($files.Count) files"
                  Write-Host ("  top level: " + ((Get-ChildItem $d.FullName | Select-Object -First 25 -ExpandProperty Name) -join ', '))
                  Write-Host ("  first files: " + (($files | Select-Object -First 6 -ExpandProperty FullName) -join ' ; '))
                }
                # 注意：jpackage 的 app-image 会 strip 掉 runtime/bin/java.exe，不能用它判断
                $exeHit = Get-ChildItem $d.FullName -Recurse -Filter "LumiCode.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
                $hasCfg = Test-Path (Join-Path $d.FullName "app/LumiCode.cfg")
                $hasEntry = (Test-Path (Join-Path $d.FullName "setup.exe")) -and (Test-Path (Join-Path $d.FullName "app/setup.cfg"))
                $hasJvm = (Test-Path (Join-Path $d.FullName "runtime/bin/server/jvm.dll")) -or
                          (Test-Path (Join-Path $d.FullName "runtime/bin/jvm.dll"))
                if ($exeHit) { Write-Host "  LumiCode.exe -> $($exeHit.FullName)" }
                Write-Host "  app/LumiCode.cfg: $hasCfg | setup.exe+cfg: $hasEntry | jvm.dll: $hasJvm"
                if ($exeHit -and $hasCfg -and $hasEntry -and $hasJvm) {
                  $extracted = $true
                  Write-Host "extracted to: $($exeHit.DirectoryName) ($($files.Count) files)"
                  foreach ($probe in @("run.cmd", "LumiCode.exe", "app/LumiCode.cfg", "runtime/bin/java.exe")) {
                    Write-Host ("  has {0}: {1}" -f $probe, (Test-Path (Join-Path $d.FullName $probe)))
                  }
                  break
                }
              }
              if ($extracted) { break }
            }
          }

          Write-Host "processes:"
          Get-Process | Where-Object { $_.ProcessName -match "LumiCode|java|cmd|7z" } |
            Select-Object Id, ProcessName, StartTime | Format-Table | Out-String | Write-Host
          if ($p.HasExited) { Write-Host "sfx exit code: $($p.ExitCode)" } else { Write-Host "sfx still running" }

          Get-Process | Where-Object { $_.ProcessName -match "^(run|LumiCode|java|cmd)$" } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { $p | Stop-Process -Force -ErrorAction SilentlyContinue }

          if (-not $extracted) { throw "smoke test failed: SFX did not extract a complete app image into any temp root" }
          Write-Host "smoke test passed: app image extracted and launcher started"

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main/msi/*.msi out/ 2>/dev/null || true
          # portable zip (解压即用，无需安装)
          if [ -d composeApp/build/compose/binaries/main/app/LumiCode ]; then
            cd composeApp/build/compose/binaries/main/app
            if command -v 7z >/dev/null 2>&1; then 7z a -tzip "$GITHUB_WORKSPACE/out/LumiCode-windows-portable.zip" LumiCode >/dev/null; fi
            cd "$GITHUB_WORKSPACE"
          fi
          ls -la out

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------- Android
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate throwaway signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/lumicode.jks" -alias lumicode \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lumicode -keypass lumicode \
            -dname "CN=LumiCode Demo, OU=Demo, O=LumiCode, C=CN"
          keytool -list -v -keystore "$RUNNER_TEMP/lumicode.jks" -storepass lumicode \
            | grep -E "SHA256:|SHA1:" | head -2 > "$RUNNER_TEMP/fingerprints.txt" || true

      - name: Build signed release APK
        run: |
          ./gradlew --no-daemon :composeApp:assembleRelease --console=plain \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/lumicode.jks" \
            -Pandroid.injected.signing.store.password=lumicode \
            -Pandroid.injected.signing.key.alias=lumicode \
            -Pandroid.injected.signing.key.password=lumicode

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp composeApp/build/outputs/apk/release/*.apk "out/LumiCode-android-release.apk"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  # ------------------------------------------------------------ Linux / Web
  linux-web:
    name: Linux + Web (Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install deb packaging prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot

      - name: Build Linux packages and Wasm distribution
        run: |
          ./gradlew --no-daemon :composeApp:packageDeb :composeApp:wasmJsBrowserDistribution --console=plain

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main/deb/*.deb out/ || true
          if [ -d composeApp/build/dist/wasmJs/productionExecutable ]; then
            cd composeApp/build/dist/wasmJs
            zip -qr "$GITHUB_WORKSPACE/out/LumiCode-web-wasm.zip" productionExecutable
            cd "$GITHUB_WORKSPACE"
          fi
          ls -la out

      - name: Upload Linux/Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-web
          path: out/*
          if-no-files-found: warn

  # ---------------------------------------------------------------- Release
  release:
    name: Publish release
    needs: [windows, android, linux-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected files
        run: |
          ls -laR artifacts | head -50
          [ -f artifacts/LumiCode-portable.exe ] || echo "::warning title=portable exe missing::this release has no single-file Windows exe"

      - name: Determine tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "LUMICODE — ANALYSIS OS ${{ steps.meta.outputs.tag }}"
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: artifacts/**/*
          body: |
            ## LUMICODE — ANALYSIS OS（档案风格代码编辑器 Demo）

            同一份 Compose Multiplatform 代码，四个平台目标。

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows | `LumiCode-portable.exe` | **单文件，双击即运行，不安装**。自解压到临时目录后启动；退出后自动清理 |
            | Windows | `LumiCode-windows-portable.zip` | 便携版压缩包：解压一次后双击 `LumiCode.exe`，之后每次启动更快（不用重新解压） |
            | Windows | `LumiCode-1.0.0.msi` | 安装版：会写入开始菜单/卸载项，适合长期使用 |
            | Android | `LumiCode-android-release.apk` | 直接安装（需允许「未知来源」）；签名用 CI 临时密钥，仅供试用 |
            | Linux | `lumicode_*.deb` | `sudo dpkg -i` 安装 |
            | Web | `LumiCode-web-wasm.zip` | 解压后用任意静态服务器托管 `index.html`（或 `python3 -m http.server`） |

            **关于 Windows 提示**：这些产物没有代码签名证书，首次运行会出现蓝色「Windows 已保护你的电脑 / 未知发布者」提示 —
            点「更多信息」→「仍要运行」即可。想彻底消掉需要买一张代码签名证书（约 ¥1000/年）。

            > 构建产物由 GitHub Actions 生成，提交：`${{ steps.meta.outputs.sha }}`

            ### 快捷键
            `Ctrl/Cmd+K` 命令面板 · `Ctrl/Cmd+P` 快速打开 · `Ctrl/Cmd+F` 查找 · `Ctrl/Cmd+S` 保存 · `F5` 运行分析

            详细说明见仓库 [README](https://github.com/${{ github.repository }}#readme)。
