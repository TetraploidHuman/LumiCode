<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- LumiCode: simple blue snowflake -->
  <defs>
    <style>
      .arm { stroke: #2563EB; stroke-width: 28; stroke-linecap: round; stroke-linejoin: round; }
      .tip { stroke: #2563EB; stroke-width: 22; stroke-linecap: round; }
    </style>
  </defs>
  <g transform="translate(256 256)">
    <!-- six main arms -->
    <g class="arm">
      <line x1="0" y1="-190" x2="0" y2="190"/>
      <line x1="-164.5" y1="-95" x2="164.5" y2="95"/>
      <line x1="-164.5" y1="95" x2="164.5" y2="-95"/>
    </g>
    <!-- branch tips on each arm (rotate 0/60/120&) -->
    <g class="tip">
      <!-- north -->
      <line x1="0" y1="-120" x2="-42" y2="-158"/>
      <line x1="0" y1="-120" x2="42" y2="-158"/>
      <!-- NE -->
      <line x1="104" y1="-60" x2="86" y2="-118"/>
      <line x1="104" y1="-60" x2="158" y2="-78"/>
      <!-- SE -->
      <line x1="104" y1="60" x2="158" y2="78"/>
      <line x1="104" y1="60" x2="86" y2="118"/>
      <!-- south -->
      <line x1="0" y1="120" x2="-42" y2="158"/>
      <line x1="0" y1="120" x2="42" y2="158"/>
      <!-- SW -->
      <line x1="-104" y1="60" x2="-86" y2="118"/>
      <line x1="-104" y1="60" x2="-158" y2="78"/>
      <!-- NW -->
      <line x1="-104" y1="-60" x2="-158" y2="-78"/>
      <line x1="-104" y1="-60" x2="-86" y2="-118"/>
    </g>
    <circle cx="0" cy="0" r="22" fill="#2563EB"/>
  </g>
</svg>
